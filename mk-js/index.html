<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mk.js 视频对比</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><p class="eyebrow">SOLARRENDERER · MK.JS</p><h1>双人格斗视频对比</h1><p class="intro">GT、碰撞体结构视频与生成结果同步对比。</p></div><div class="facts"><span>600 × 400</span><span>24 fps</span><span>15 秒</span></div></header><section class="toolbar" aria-label="播放控制"><label><input id="sync" type="checkbox" checked>同步播放</label><button id="play" type="button">播放</button><button id="pause" class="secondary" type="button">暂停</button><button id="reset" class="secondary" type="button">重置</button><input id="seek" type="range" min="0" max="15" step="0.01" value="0" aria-label="播放进度"><span id="time">0.00 / 15.00</span><select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></section><p id="status" role="status" aria-live="polite"></p><section class="video-grid"><figure><figcaption><strong>GT</strong><a href="media/gt.mp4" target="_blank" rel="noopener">单独打开 ↗</a></figcaption><video muted playsinline controls preload="metadata" src="media/gt.mp4"></video></figure><figure><figcaption><strong>Bounding Box 结构</strong><a href="media/structure.mp4" target="_blank" rel="noopener">单独打开 ↗</a></figcaption><video muted playsinline controls preload="metadata" src="media/structure.mp4"></video></figure><figure><figcaption><strong>SolarRenderer 生成</strong><a href="media/render.mp4" target="_blank" rel="noopener">单独打开 ↗</a></figcaption><video muted playsinline controls preload="metadata" src="media/render.mp4"></video></figure></section><footer>空格键切换播放和暂停，可拖动进度条同步定位。</footer></main><script src="app.js"></script></body></html>
