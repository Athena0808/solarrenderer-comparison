<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SolarRenderer 视频对比</title><style>*{box-sizing:border-box}body{background:#101722;color:#e5edf8;font:15px system-ui;margin:0;padding:28px}main{max-width:1600px;margin:auto}h1{font-size:26px}p{color:#9fb0c8}section{background:#1b2636;border:1px solid #33445b;border-radius:12px;padding:20px;margin:24px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}video{width:100%;aspect-ratio:var(--video-ratio,4/3);background:#080d15;object-fit:contain}figure{margin:0}figcaption{padding:10px 0}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0}button,select{padding:9px 14px;background:#324d70;color:white;border:0;border-radius:6px;cursor:pointer}input[type=range]{flex:1;min-width:140px;accent-color:#8cd2ff}a{color:#8cd2ff}.time{font-variant-numeric:tabular-nums}.status{color:#f0c580}@media(max-width:800px){.grid{grid-template-columns:1fr}body{padding:12px}}</style><main><h1>SolarRenderer 视频对比</h1><p>每个 case 并排展示 GT、语义与生成视频，支持同步播放、暂停及跳转。</p><div id="cases"></div></main><script>
for(const c of [{"name": "Clumsy Bird", "base": "clumsy", "render": "clumsy-render", "size": "900 × 600"}, {"name": "Onslaught Arena", "base": "arena", "render": "arena-render", "size": "640 × 480"}, {"name": "Altos 8-bit", "base": "altos", "render": "altos-render", "size": "640 × 360"}, {"name": "BrowserQuest", "base": "browserquest", "render": "browserquest-render", "size": "960 × 448"}, {"name": "JavaScript Racer", "base": "racer", "render": "racer-render", "size": "640 × 480"}, {"name": "Pixel Hop Twins", "base": "pixel", "render": "pixel-render", "size": "640 × 400"}, {"name": "Radius Raid", "base": "radius", "render": "radius-render", "size": "800 × 600"}]){
const s=document.createElement('section');s.style.setProperty('--video-ratio',c.size.replace(' × ',' / '));s.innerHTML=`<h2>${c.name}</h2><p>${c.size} · 24 fps · 15 秒</p><div class="bar"><label><input class="sync" type="checkbox" checked> 同步</label><button class="play">播放</button><button class="pause">暂停</button><button class="reset">重置</button><input class="seek" type="range" min="0" max="15" step="0.01" value="0" aria-label="进度"><span class="time">0.00 / 15.00</span><select aria-label="倍速"><option value="0.5">0.5×</option><option selected value="1">1×</option><option value="2">2×</option></select></div><div class="grid">${[['GT',c.base+'/gt.mp4'],['语义',c.base+'/structure.mp4'],['生成',c.render+'/render.mp4']].map(([n,p])=>`<figure><figcaption>${n} · <a href="${p}" target="_blank">单独打开 ↗</a></figcaption><video muted playsinline controls preload="metadata" src="${p}"></video></figure>`).join('')}</div><p class="status" role="status"></p>`;document.querySelector('#cases').append(s);
const videos=[...s.querySelectorAll('video')],sync=s.querySelector('.sync'),slider=s.querySelector('.seek');let leader=videos[0],lock=false;
function align(t,items=videos){for(const v of items)if(v.readyState&&Math.abs(v.currentTime-t)>.05)v.currentTime=Math.min(t,v.duration||15)}
function play(items){Promise.allSettled(items.map(v=>v.play())).then(r=>{if(r.some(x=>x.status==='rejected'))s.querySelector('.status').textContent='视频尚未就绪，请稍后再点播放。'})}
s.querySelector('.play').onclick=()=>{if(sync.checked)align(leader.currentTime);play(videos)};s.querySelector('.pause').onclick=()=>videos.forEach(v=>v.pause());s.querySelector('.reset').onclick=()=>{videos.forEach(v=>v.pause());align(0)};slider.oninput=()=>align(+slider.value);s.querySelector('select').onchange=e=>videos.forEach(v=>v.playbackRate=+e.target.value);sync.onchange=()=>{if(sync.checked){align(leader.currentTime);if(!leader.paused)play(videos);else videos.forEach(v=>v.pause())}};
for(const v of videos){v.onpointerdown=()=>leader=v;v.onplay=()=>{if(sync.checked&&!lock){lock=true;leader=v;align(v.currentTime,videos.filter(x=>x!==v));play(videos.filter(x=>x!==v));lock=false}};v.onpause=()=>{if(sync.checked&&!lock){lock=true;videos.filter(x=>x!==v).forEach(x=>x.pause());lock=false}};v.onseeking=()=>{if(sync.checked&&v===leader)align(v.currentTime,videos.filter(x=>x!==v))};v.onerror=()=>s.querySelector('.status').textContent='视频加载失败，请检查文件或服务。'}
setInterval(()=>{const t=leader.currentTime||0;slider.value=t;s.querySelector('.time').textContent=t.toFixed(2)+' / 15.00';if(sync.checked&&!leader.paused&&!leader.seeking)for(const v of videos)if(v!==leader&&v.readyState>=3&&!v.seeking&&Math.abs(v.currentTime-t)>.2)v.currentTime=t},250)
}
</script></html>
